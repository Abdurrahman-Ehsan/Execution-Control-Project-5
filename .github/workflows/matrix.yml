
name: Matrix Use

on:
  push:
    branches:
      - master

jobs:
  build:
    continue-on-error: true

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        version: [18, 20]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Code loading
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

