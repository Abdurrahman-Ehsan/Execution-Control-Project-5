name: Matrix Use
on: 
  push:
    branches:
      - master

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        os : [ubuntu-latest , windows-latest]
        version : [17, 18]
    runs-on: ${{matrix.os}}
    steps:
      name: codeloading
      uses: actions/checkout@v5
      name: install node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{matrix.version}}
      name: install dependencies
      run: npm ci
      name: build
      run: npm run build
